[project]
name = "civilfem-agent"
version = "0.1.0"
description = "开源优先的多构件土木结构仿真 Agent 基础骨架"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2"]
formats = ["ifcopenshell>=0.8", "ezdxf>=1.3"]
mesh = ["gmsh>=4.13", "meshio>=5.3"]
solver = ["openseespy>=3.6"]
visualization = ["pyvista>=0.46"]
gui = ["streamlit>=1.36,<2"]
dev = ["pytest>=8,<9", "ifcopenshell>=0.8", "ezdxf>=1.3", "gmsh>=4.13", "meshio>=5.3", "openseespy>=3.6", "pyvista>=0.46"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["civilfem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
